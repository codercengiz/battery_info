plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace "com.igrik12.battery_info"

    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 23
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}